name: Mobile + Web E2E

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**.md'

jobs:
  mobile:
    runs-on: self-hosted
    if: false   # requires an attached Android device + Appium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - name: Start Appium
        run: |
          npx appium --base-path / &
          sleep 8
      - run: npm run test:mobile
      - run: npm run report
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: mobile-target, path: target }

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npm run playwright:install
      - run: npm run test:web
      - run: npm run report
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: web-target, path: target }
