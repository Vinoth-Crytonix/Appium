name: Android E2E

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**.md'

jobs:
  test:
    # Real-device runs require a self-hosted runner with the Android device
    # attached and Appium 2 installed.
    runs-on: self-hosted
    if: false   # remove this line once a self-hosted runner is wired up
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run typecheck

      - name: Start Appium
        run: |
          npx appium --base-path / &
          sleep 8

      - run: npm test

      - run: npm run report
        if: always()

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: target
          path: target
